name: Build and Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:

  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Python dependencies
        run: pip install pygame-ce pyinstaller

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build Mac app
        run: pyinstaller buildmac.spec

      - name: Upload DMG to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Rock Sickle macOS.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Python dependencies
        run: pip install pygame-ce pyinstaller

      - name: Build Windows exe
        run: pyinstaller buildwin.spec

      - name: Upload EXE to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Rock Sickle Windows.exe

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev
          pip install pygame-ce pyinstaller

      - name: Build Linux binary
        run: pyinstaller buildlinux.spec

      - name: Set up AppDir
        run: |
          mkdir -p AppDir/usr/bin
          cp -r "dist/Rock Sickle/." AppDir/usr/bin/

          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/Rock Sickle Linux" "$@"
          EOF
          chmod +x AppDir/AppRun

          cat > AppDir/rock-sickle.desktop << 'EOF'
          [Desktop Entry]
          Name=Rock Sickle
          Exec=Rock Sickle
          Icon=rock-sickle
          Type=Application
          Categories=Game;
          EOF

          cp Assets/Images/Icons/RockSickle.png AppDir/rock-sickle.png

      - name: Download appimagetool
        run: |
          wget -q -O appimagetool \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool

      - name: Build AppImage
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir "dist/Rock Sickle Linux.AppImage"

      - name: Upload AppImage to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Rock Sickle Linux.AppImage
