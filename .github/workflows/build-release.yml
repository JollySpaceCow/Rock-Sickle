name: Build and Release

on:
  release:
    types: [published]

jobs:

  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Python dependencies
        run: pip install pygame-ce pyinstaller

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build Mac app
        run: pyinstaller buildmac.spec

      - name: Upload DMG to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Rock Sickle.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Python dependencies
        run: pip install pygame-ce pyinstaller

      - name: Build Windows exe
        run: pyinstaller buildwin.spec

      - name: Upload EXE to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Rock Sickle.exe

build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev
          pip install pygame-ce pyinstaller

      - name: Build Linux binary
        run: pyinstaller buildwin.spec

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Rock Sickle